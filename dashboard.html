<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <style>
    .blueprint-container {
      position: relative;
      width: 750px;
      margin-top: 20px;
    }

    .blueprint {
      width: 100%;
    }

    .slot {
  position: absolute;
  width: 18px;
  height: 18px;
  border-radius: 50%;   /* circle */
  border: 2px solid white;
  cursor: pointer;
  transition: 0.3s ease;
  color: black;          /* change text color here */
  font-size: 8px;        /* small text */
  text-align: center;
  line-height: 18px;     /* vertically center text */
  font-weight: bold;
}

.free-slot {
  background-color: #2ecc71;
}

.booked-slot {
  background-color: #3498db;
}

.entered-slot {
  background-color: #e74c3c;
}
/* ===== ENTRY / EXIT BLINKING ===== */

.arrow {
  position: absolute;
  font-size: 32px;
  color: yellow;
  animation: blink 1s infinite;
}

@keyframes blink {
  0% { opacity: 1; }
  50% { opacity: 0.2; }
  100% { opacity: 1; }
}

/* ===== MOVING TRAFFIC ARROWS ===== */

.road-arrow {
  position: absolute;
  font-size: 24px;
  color: white;
  /* animation: moveArrow 2s linear infinite; */
}

@keyframes moveArrow {
  0% {
    transform: translateX(0);
    opacity: 0.3;
  }
  50% {
    opacity: 1;
  }
  100% {
    transform: translateX(40px);
    opacity: 0.3;
  }
}

  </style>
</head>

<body>
<div class="container">

<h2>Dashboard</h2>

<button onclick="goAddVehicle()">Add Vehicle</button>
<button onclick="goBookSlot()">Book Slot</button>
<button onclick="logout()">Logout</button>

<hr>

<h3>My Vehicles 🚗</h3>
<ul id="vehicleList">
  <li>Loading vehicles...</li>
</ul>

<hr>

<h3>Parking Layout 🅿️</h3>

<select id="floorSelect" onchange="loadSlots()">
  <option value="1">Floor 1</option>
  <option value="2">Floor 2</option>
</select>

<div class="blueprint-container">

  <img src="floor1.png" class="blueprint">

  <!-- ENTRY -->
  <div class="arrow" style="top:180px; left:20px;">➡️ ENTRY</div>

  <!-- EXIT -->
  <div class="arrow" style="top:140px; right:13px;">EXIT <br>⬆️</div>

  <!-- ROAD FLOW -->
  <div class="road-arrow" style="top:420px; left:100px;">➡️</div>
  <div class="road-arrow" style="top:420px; left:180px;">➡️</div>
  <div class="road-arrow" style="top:420px; left:260px;">➡️</div>

  <div class="road-arrow" style="top:260px; left:350px;">➡️</div>
  <div class="road-arrow" style="top:260px; left:430px;">➡️</div>
  <div class="road-arrow" style="top:260px; left:510px;">➡️</div>

  <div class="road-arrow" style="top:140px; left:620px;">⬆️</div>
  <div class="road-arrow" style="top:200px; left:620px;">⬆️</div>

  <div id="slotOverlay"></div>

</div>

<hr>

<h3>License Plate Detection 🎥</h3>

<input type="file" id="videoFile" accept="video/*">
<br><br>
<button onclick="detectPlate()">Detect Plate (Upload)</button>

<p id="loading" style="color: orange;"></p>
<p id="result" style="font-weight: bold;"></p>

<hr>

<h4>Or Use Live Camera 📷</h4>

<button onclick="startCamera()">Start Camera</button>
<button onclick="stopCamera()">Stop Camera</button>

<br><br>

<video id="video" width="400" autoplay></video>
<canvas id="canvas" style="display:none;"></canvas>

<script>

const SUPABASE_URL = "https://quphlpzdehgividhdori.supabase.co";
const SUPABASE_KEY = ""; // 🔐 Add your Supabase anon/public key here

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ================= PROTECT PAGE ================= */

window.onload = async () => {

  const { data: { session } } = await client.auth.getSession();

  if (!session) {
    alert("Please login");
    window.location.href = "login.html";
    return;
  }

  loadVehicles();
  loadSlots();
};

setInterval(() => {
  loadSlots();
}, 3000);

/* ================= LOAD VEHICLES ================= */

async function loadVehicles() {

  const { data: { user } } = await client.auth.getUser();

  const { data } = await client
    .from("vehicles")
    .select("number_plate")
    .eq("user_id", user.id);

  const list = document.getElementById("vehicleList");
  list.innerHTML = "";

  if (!data || data.length === 0) {
    list.innerHTML = "<li>No vehicles added</li>";
    return;
  }

  data.forEach(v => {
    const li = document.createElement("li");
    li.innerText = v.number_plate;
    list.appendChild(li);
  });
}

/* ================= LOAD SLOTS (BLUEPRINT VERSION) ================= */

    div.classList.add("slot");

      div.classList.add("free-slot");
    else if (slot.status === "booked")
      div.classList.add("booked-slot");

      // Block C (Bottom Row)
"F1C1": { top: 380, left: 143 },
"F1C2": { top: 380, left: 190 },
"F1C3": { top: 380, left: 228 },
"F1C4": { top: 380, left: 273 },
"F1C5": { top: 380, left: 310 },
"F1C6": { top: 380, left: 349 },
"F1C7": { top: 380, left: 396 },
"F1C8": { top: 380, left: 437},
"F1C9": { top: 380, left: 484 },

// ================= FLOOR 2 =================

// Block A

// Block C
"F2C1": { top: 380, left: 143 },
"F2C2": { top: 380, left: 190 },
"F2C3": { top: 380, left: 228 },

"F2C13": { top: 380, left: 660 },
"F2C14": { top: 380, left: 700 },
    };

    const pos = positions[slot.slot_code];

    if (pos) {
      div.style.top = pos.top + "px";
      div.style.left = pos.left + "px";
      overlay.appendChild(div);
    }
  });
}
/* ================= FREE SLOT ================= */

async function freeSlot(slotId) {

  await client
    .from("parking_slots")
    .update({ status: "free" })
    .eq("id", slotId);

  loadSlots();
}

/* ================= VIDEO UPLOAD ================= */

async function detectPlate() {

  const fileInput = document.getElementById("videoFile");
  const loading = document.getElementById("loading");
  const result = document.getElementById("result");

  if (fileInput.files.length === 0) {
    alert("Please upload a video");
    return;
  }

  const file = fileInput.files[0];
  const formData = new FormData();
  formData.append("file", file);

  loading.innerText = "Processing video... ⏳";
  result.innerText = "";

  try {
    const response = await fetch("http://127.0.0.1:8000/detect", {
      method: "POST",
      body: formData
    });

    const data = await response.json();
    loading.innerText = "";

    if (data.status === "allowed")
      result.innerText = "✅ Allowed - Slot " + data.slot + " | Plate: " + data.plate;
    else if (data.status === "denied")
      result.innerText = "❌ No Active Booking - Plate: " + data.plate;
    else
      result.innerText = "No plate detected";

  } catch (error) {
    loading.innerText = "";
    result.innerText = "Backend connection error ❌";
  }
}

/* ================= WEBCAM ================= */

let stream;
let cameraInterval;

function startCamera() {
  navigator.mediaDevices.getUserMedia({ video: true })
    .then(s => {
      stream = s;
      document.getElementById("video").srcObject = stream;
      cameraInterval = setInterval(sendFrame, 1000);
    })
    .catch(err => alert("Camera not working ❌"));
}

function stopCamera() {
  if (stream) {
    stream.getTracks().forEach(track => track.stop());
  }
  clearInterval(cameraInterval);
}

async function sendFrame() {

  const video = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  ctx.drawImage(video, 0, 0);

  const imageData = canvas.toDataURL("image/jpeg");

  try {
    const response = await fetch("http://127.0.0.1:8000/detect-frame", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ image: imageData })
    });

    const data = await response.json();

    if (data.status === "allowed")
      document.getElementById("result").innerText =
        "✅ Allowed - Slot " + data.slot + " | Plate: " + data.plate;

    if (data.status === "denied")
      document.getElementById("result").innerText =
        "❌ No Active Booking - Plate: " + data.plate;

  } catch (error) {
    console.error(error);
  }
}

/* ================= NAVIGATION ================= */

function goAddVehicle() { window.location.href = "add_vehicle.html"; }
function goBookSlot() { window.location.href = "book_slot.html"; }
async function logout() {
  await client.auth.signOut();
  window.location.href = "login.html";
}

</script>
